name: Morcus CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run. Pushes to `dev` each
# get their own run (`run_id` is unique), so every `dev` commit is fully
# tested; `dev-latest` ordering is handled in `build-image` instead.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  presubmit-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Installing npm dependencies
        run: npm ci
      - name: Get rustc version
        id: rustc
        run: echo "version=$(rustc -V)" >> "$GITHUB_OUTPUT"
      - name: Cache nj-cli and Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/nj-cli
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: rust-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock', 'package.json') }}
      - name: Building Rust bindings
        env:
          CARGO_INCREMENTAL: 0
        run: |
          cargo clean --release -p corpus -p morceus -p corpus_rust_wrapper || true
          npm run setup-node-bindgen
      - name: Installing Python dependencies
        run: pip install -r requirements.txt
      - name: Running unit tests
        run: npm run coverage
      - name: Checking formatting
        run: npm run format-check
      - name: Checking TS types
        run: npx tsc
      - name: Checking Python types
        run: npm run pyright
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./coverage

  build-image:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            tag_suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE: ghcr.io/nkprasad12/morcus:${{ github.sha }}${{ matrix.tag_suffix }}
      LATEST: ghcr.io/nkprasad12/morcus:dev-latest${{ matrix.tag_suffix }}
      PREVIOUS: ghcr.io/nkprasad12/morcus:dev-previous${{ matrix.tag_suffix }}
      PR_LATEST: ghcr.io/nkprasad12/morcus:pr-latest${{ matrix.tag_suffix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Seconds, versus minutes for a Docker build that can't fetch a pin.
      - name: Verify upstream data pins
        run: node src/scripts/upstream/verify_pins.mjs
      - name: Build image
        run: |
          docker build . --tag $CANDIDATE \
            --build-arg "SOURCE_VERSION=${{ github.sha }}" \
            --label "runnumber=${GITHUB_RUN_ID}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Push image
        run: docker push $CANDIDATE
      # If runs for two `dev` pushes overlap, the older one may finish last.
      # Only move `dev-latest` (and `dev-previous`) if this commit is still
      # the head of `dev`, so `dev-latest` can never go backwards.
      - name: Check this commit is still the head of dev
        id: head
        if: github.ref == 'refs/heads/dev'
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [ "$HEAD_SHA" = "${{ github.sha }}" ]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev has moved on to $HEAD_SHA; not updating dev-latest."
            echo "is_head=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Backup current dev image
        if: steps.head.outputs.is_head == 'true'
        run: docker pull $LATEST && docker tag $LATEST $PREVIOUS && docker push $PREVIOUS || true
      - name: Push latest dev image
        if: steps.head.outputs.is_head == 'true'
        run: |
          docker tag $CANDIDATE $LATEST
          docker push $LATEST
      - name: Push latest PR image
        if: github.ref != 'refs/heads/dev'
        run: |
          docker tag $CANDIDATE $PR_LATEST
          docker push $PR_LATEST

  validate-image:
    needs: [build-image]
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            tag_suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Installing npm dependencies
        run: npm ci
      - name: Installing browsers
        run: npx playwright install --with-deps
      - name: Pulling docker image
        run: docker pull ghcr.io/nkprasad12/morcus:${{ github.sha }}${{ matrix.tag_suffix }}
      - name: Running integration checks
        run: IMAGE_TAG=${{ github.sha }}${{ matrix.tag_suffix }} npm run integration-tests
      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: functional-test-report-${{ matrix.arch }}
          path: playwright-report/

  build-helper-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [morcus-proxy, morcus-latincy, morcus-pruner]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Installing npm dependencies
        run: npm ci
      - name: Setting up .env
        run: touch .env
      - name: Log in to registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Build and smoke-test ${{ matrix.name }} (PR)
        if: github.event_name != 'push'
        run: npm run tsnp src/scripts/helper_images/cli.ts -- build-and-test ${{ matrix.name }}
      - name: Build, smoke-test, and push ${{ matrix.name }} (dev)
        if: github.event_name == 'push'
        run: npm run tsnp src/scripts/helper_images/cli.ts -- build-and-push ${{ matrix.name }}

  preview-helper-image-promotion:
    # Checks that every helper image for this commit is built and tested, and
    # reports which ones the next `main` release would promote (and so
    # redeploy). Changes nothing in the registry. It doesn't log in to GHCR:
    # the helper image packages are public, so `imagetools inspect` works
    # anonymously (and there is nothing here that needs write access).
    if: github.event_name == 'push'
    needs: build-helper-images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Installing npm dependencies
        run: npm ci
      - name: Setting up .env
        run: touch .env
      - name: Preview helper image promotion
        run: npm run tsnp src/scripts/helper_images/cli.ts -- promote --dry-run
