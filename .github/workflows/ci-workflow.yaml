name: Morcus CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run. Pushes to `dev` each
# get their own run (`run_id` is unique), so every `dev` commit is fully
# tested; `dev-latest` ordering is handled in `build-image` instead.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  presubmit-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Installing npm dependencies
        run: npm ci
      - name: Building Rust bindings
        run: npm run setup-node-bindgen
      - name: Installing Python dependencies
        run: pip install -r requirements.txt
      - name: Running unit tests
        run: npm run coverage
      - name: Checking formatting
        run: npm run format-check
      - name: Checking TS types
        run: npx tsc
      - name: Checking Python types
        run: npm run pyright
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./coverage

  build-image:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            tag_suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE: ghcr.io/nkprasad12/morcus:${{ github.sha }}${{ matrix.tag_suffix }}
      LATEST: ghcr.io/nkprasad12/morcus:dev-latest${{ matrix.tag_suffix }}
      PREVIOUS: ghcr.io/nkprasad12/morcus:dev-previous${{ matrix.tag_suffix }}
      PR_LATEST: ghcr.io/nkprasad12/morcus:pr-latest${{ matrix.tag_suffix }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build image
        run: |
          docker build . --tag $CANDIDATE \
            --build-arg "SOURCE_VERSION=${{ github.sha }}" \
            --label "runnumber=${GITHUB_RUN_ID}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Push image
        run: docker push $CANDIDATE
      # If runs for two `dev` pushes overlap, the older one may finish last.
      # Only move `dev-latest` (and `dev-previous`) if this commit is still
      # the head of `dev`, so `dev-latest` can never go backwards.
      - name: Check this commit is still the head of dev
        id: head
        if: github.ref == 'refs/heads/dev'
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [ "$HEAD_SHA" = "${{ github.sha }}" ]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev has moved on to $HEAD_SHA; not updating dev-latest."
            echo "is_head=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Backup current dev image
        if: steps.head.outputs.is_head == 'true'
        run: docker pull $LATEST && docker tag $LATEST $PREVIOUS && docker push $PREVIOUS || true
      - name: Push latest dev image
        if: steps.head.outputs.is_head == 'true'
        run: |
          docker tag $CANDIDATE $LATEST
          docker push $LATEST
      - name: Push latest PR image
        if: github.ref != 'refs/heads/dev'
        run: |
          docker tag $CANDIDATE $PR_LATEST
          docker push $PR_LATEST

  validate-image:
    needs: [build-image]
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            tag_suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Installing npm dependencies
        run: npm ci
      - name: Installing browsers
        run: npx playwright install --with-deps
      - name: Pulling docker image
        run: docker pull ghcr.io/nkprasad12/morcus:${{ github.sha }}${{ matrix.tag_suffix }}
      - name: Running integration checks
        run: IMAGE_TAG=${{ github.sha }}${{ matrix.tag_suffix }} npm run integration-tests
      - name: Upload test report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: functional-test-report-${{ matrix.arch }}
          path: playwright-report/

  e2e-performance:
    needs: [build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        screenSize: [small, large]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Pulling docker images
        run: |
          docker pull ghcr.io/nkprasad12/morcus:${{ github.sha }}
          docker pull ghcr.io/nkprasad12/morcus:main-latest
      - name: Installing npm dependencies
        run: npm ci
      - name: Installing browsers
        run: npx playwright install chromium --with-deps
      - name: Setting up .env
        run: touch .env
      - name: Setting comparison tag (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: echo "A_TAG=main-latest" >> "$GITHUB_ENV"
      - name: Setting comparison tag (non-dev branch)
        if: github.ref != 'refs/heads/dev'
        run: echo "A_TAG=dev-latest" >> "$GITHUB_ENV"
      - name: Running Performance tests
        run: npm run tsnp src/scripts/perf_a_b.ts -- --A=$A_TAG --B=${{ github.sha }} --N=40 --screenSize=${{ matrix.screenSize }} --ci
      - name: Upload Performance report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: performance-report-${{ matrix.screenSize }}
          path: e2e_metrics/
