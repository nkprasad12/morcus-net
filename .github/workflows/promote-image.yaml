name: Promote Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

# Promotions run one at a time, in order. If several are queued, GitHub keeps
# only the newest pending one, which is the one we want to end up as latest.
concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      matrix:
        include:
          - arch: x86
            tag_suffix: ""

    steps:
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Fetch dev image
        run: timeout 2m bash -c 'until docker pull ghcr.io/nkprasad12/morcus:${{ github.sha }}${{ matrix.tag_suffix }}; do sleep 10; done'
      - name: Backup current image
        run: |
          LATEST=ghcr.io/nkprasad12/morcus:main-latest${{ matrix.tag_suffix }}
          PREVIOUS=ghcr.io/nkprasad12/morcus:main-previous${{ matrix.tag_suffix }}
          docker pull $LATEST && docker tag $LATEST $PREVIOUS && docker push $PREVIOUS || true
      - name: Promote dev image
        run: |
          LATEST=ghcr.io/nkprasad12/morcus:main-latest${{ matrix.tag_suffix }}
          CANDIDATE=ghcr.io/nkprasad12/morcus:${{ github.sha }}${{ matrix.tag_suffix }}
          docker tag $CANDIDATE $LATEST
          docker push $LATEST

  promote-helper-images:
    runs-on: ubuntu-24.04
    # Longer than other jobs: the `helper_images/cli.ts promote` command waits
    # up to 10 minutes in total for the images' `tested-` tags, which the same
    # commit's `dev` CI run may still be creating.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Installing npm dependencies
        run: npm ci
      - name: Setting up .env
        run: touch .env
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Promote helper images
        run: npm run tsnp src/scripts/helper_images/cli.ts -- promote
