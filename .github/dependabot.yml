version: 2
# PRs target dev, where CI runs (ci-workflow.yaml), and reach main via the
# usual dev -> main fast-forward. Dependabot reads this file from main, so
# changes here take effect after the next fast-forward.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: quarterly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /src/devops/reverse_proxy
    target-branch: dev
    schedule:
      interval: quarterly

  # The server and pruner images pin the same `node` base by digest (see the
  # comment at the top of /Dockerfile); bump them together. A pruner base bump
  # also changes its tag in src/scripts/helper_images/expected_tags.ts.
  # src/py/latincy/image is left out on purpose: it pins our own archived image.
  - package-ecosystem: docker
    directories:
      - /
      - /src/devops/pruner
    target-branch: dev
    schedule:
      interval: quarterly
    groups:
      node-base:
        patterns:
          - "node"
