version: 2
# PRs target dev, where CI runs (ci-workflow.yaml), and reach main via the
# usual dev -> main fast-forward. Dependabot reads this file from main, so
# changes here take effect after the next fast-forward.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: semiannually
    groups:
      actions:
        patterns:
          - "*"

  # Group all tracked Docker base bumps into a single semiannual PR:
  # - / and /src/devops/pruner pin the same `node` base by digest (see the
  #   comment at the top of /Dockerfile and `images.test.ts`).
  # - /src/devops/reverse_proxy pins `nginx` by digest.
  # Helper image base bumps change `src/scripts/helper_images/expected_tags.ts`,
  # and Node major bumps also require updating `.nvmrc` (`images.test.ts` prints
  # what needs updating).
  # `src/py/latincy/image` (frozen archived image) and `src/devops/watchtower`
  # (manual upstream attestation check) are left out on purpose.
  - package-ecosystem: docker
    directories:
      - /
      - /src/devops/pruner
      - /src/devops/reverse_proxy
    target-branch: dev
    schedule:
      interval: semiannually
    groups:
      docker-bases:
        patterns:
          - "*"
