daemon off;
events {}
http {

  log_format basic_log '$http_x_forwarded_for - $remote_addr - $host [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /morcus/access.log basic_log;
  error_log /morcus/error.log;

  ssl_certificate     /run/secrets/ssl_cert;
  ssl_certificate_key /run/secrets/ssl_private_key;

  # Re-resolve Docker service names in the background via Docker's embedded DNS
  # (127.0.0.11) using `resolve` on the `upstream` server entries below. This:
  #   1. Picks up new container IPs within ~2s when Watchtower or `docker
  #      compose up -d` recreates `prod` or `dev` (preventing 502s or IP-swap
  #      cross-routing between prod and staging).
  #   2. Allows nginx to start even when optional profiles (e.g. `staging`)
  #      are disabled and the `dev` container does not exist.
  #
  # `valid=1s` is cheap because re-resolution runs asynchronously in the
  # background (no proxied request waits on a DNS lookup) and costs about one
  # UDP query to 127.0.0.11 every ~2s per upstream name (forwarded to the
  # host's resolvers if the name, e.g. `dev`, does not exist).
  #
  # Upstream `keepalive` pools reuse backend TCP connections; `keepalive_timeout`
  # is set to 4s so it stays below Node's default `server.keepAliveTimeout`
  # (5s). If Node's `keepAliveTimeout` is ever changed, `keepalive_timeout`
  # below must be updated to stay lower.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;

  upstream prod_backend {
    zone prod_backend 64k;
    server prod:5757 resolve;
    keepalive 16;
    # MUST be lower than Node's default `server.keepAliveTimeout` (5s), or nginx
    # can reuse a connection the backend just closed and return a 502. If Node's
    # `keepAliveTimeout` ever changes, this must change too.
    keepalive_timeout 4s;
  }

  upstream dev_backend {
    zone dev_backend 64k;
    server dev:5757 resolve;
    keepalive 16;
    keepalive_timeout 4s;
  }

  server {
    listen              ${HTTP_PORT};
    listen              443 ssl;
    server_name         "";  
    return              444;
    http2 on;
  }

  server {
    listen              ${HTTP_PORT};
    listen              443 ssl;
    server_name         ${PROD_HOST_NAMES};  
    location / {
      proxy_pass http://prod_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Keep the Host header the backend sees identical to today (`$proxy_host`
      # of `http://prod:5757`). With a named upstream it would otherwise become
      # `prod_backend`.
      proxy_set_header Host prod:5757;
    }
    http2 on;
  }

  server {
    listen              ${HTTP_PORT};
    listen              443 ssl;
    server_name         ${DEV_HOST_NAMES};  
    location / {
      proxy_pass http://dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host dev:5757;
    }
    http2 on;
  }
}
