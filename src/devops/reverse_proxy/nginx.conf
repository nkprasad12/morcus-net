daemon off;
events {}
http {

  log_format basic_log '$http_x_forwarded_for - $remote_addr - $host [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /morcus/access.log basic_log;
  error_log /morcus/error.log;

  ssl_certificate     /run/secrets/ssl_cert;
  ssl_certificate_key /run/secrets/ssl_private_key;

  # Re-resolve Docker service names via Docker's embedded DNS (127.0.0.11)
  # instead of resolving once at nginx startup. Combined with passing the
  # target via a `$variable` in `proxy_pass` below, this:
  #   1. Picks up new container IPs within 10s when Watchtower or `docker
  #      compose up -d` recreates `prod` or `dev` (preventing 502s or IP-swap
  #      cross-routing between prod and staging).
  #   2. Allows nginx to start even when optional profiles (e.g. `staging`)
  #      are disabled and the `dev` container does not exist.
  #
  # Latency / scaling note:
  #   - DNS lookup cost: at most one local loopback UDP query to 127.0.0.11
  #     per worker every `valid=10s` (<0.2 ms once per 10s, cached in between).
  #   - Using a variable in `proxy_pass` disables upstream `keepalive`
  #     connection pooling, so each proxied request opens a fresh local TCP
  #     connection to the backend container (~0.1-0.3 ms on the local Docker
  #     bridge). If we ever scale up to high QPS where that matters, switch to
  #     named `upstream` blocks with `zone` + `server prod:5757 resolve;` +
  #     `keepalive 16;` (supported in open-source nginx 1.27.3+).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  server {
    listen              ${HTTP_PORT};
    listen              443 ssl;
    server_name         "";  
    return              444;
    http2 on;
  }

  server {
    listen              ${HTTP_PORT};
    listen              443 ssl;
    server_name         ${PROD_HOST_NAMES};  
    location / {
      set $prod_upstream http://prod:5757;
      proxy_pass $prod_upstream;
    }
    http2 on;
  }

  server {
    listen              ${HTTP_PORT};
    listen              443 ssl;
    server_name         ${DEV_HOST_NAMES};  
    location / {
      set $dev_upstream http://dev:5757;
      proxy_pass $dev_upstream;
    }
    http2 on;
  }
}
